name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Custom App APK
      run: |
        # ১. অরিজিনাল main.dart এর সেফ ব্যাকআপ নেওয়া
        mkdir -p /tmp/app_code
        cp lib/main.dart /tmp/app_code/main.dart
        
        # ২. পুরো ডিরেক্টরি ক্লিন করে ফ্রেশ অ্যাপ স্ট্রাকচার বানানো
        rm -rf * .github
        flutter create --org com.todayearn --project-name today_earn .
        
        # ৩. ব্যাকআপ নেওয়া আসল কোডটি ফিরিয়ে আনা
        cp /tmp/app_code/main.dart lib/main.dart
        
        # ৪. ডিপেনডেন্সি চেক ও ক্লিন ডেবাগ বিল্ড
        flutter pub get
        flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodayEarn-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
