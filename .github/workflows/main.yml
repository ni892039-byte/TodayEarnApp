name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Project Files Safely
      run: |
        mkdir -p /tmp/backup_lib
        cp -rf lib/* /tmp/backup_lib/
        flutter create --org com.todayearn --project-name today_earn .
        cp -rf /tmp/backup_lib/* lib/
        flutter pub get

    - name: Build APK File
      run: |
        flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodayEarn-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
