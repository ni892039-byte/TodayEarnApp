name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build App with Custom Code
      run: |
        mkdir -p backup
        cp -f lib/main.dart backup/main.dart
        flutter create . --org com.todayearn --overwrite
        cp -f backup/main.dart lib/main.dart
        flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodayEarn-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
