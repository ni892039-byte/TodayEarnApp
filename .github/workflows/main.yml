name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'

    - name: Create complete Flutter structure
      run: |
        mkdir temp_app
        cd temp_app
        flutter create --org com.todayearn .
        cp -r ../lib/* ./lib/ 2>/dev/null || true
        cp ../pubspec.yaml ./pubspec.yaml 2>/dev/null || true
        flutter pub get
        flutter build apk --release
        cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodayEarn-APK
        path: app-release.apk
